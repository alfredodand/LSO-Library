version: '3'

services:

  database:
    build:
      context: .
      dockerfile: Dockerfile2
    container_name: database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 0000
      POSTGRES_DB: libreria
    ports:
      - "5432:5432"
    # command: ['postgres', '-p', '5432']
    networks:
      - backend

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: server
    ports:
      - "8080:8080"
    depends_on:
      - database
    volumes:
      - ./server.c:/app/server.c
    command: ["./start.sh"]
    networks:
      - backend

networks:
  backend:
    driver: bridge
